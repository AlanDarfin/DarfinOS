[%General]
comment=DarfinOS Notebook flat graphite and gold
respect_DE=false
composite=false
translucent_windows=false

[GeneralColors]
window.color=#20242b
base.color=#171a1f
alt.base.color=#252930
button.color=#2c313a
light.color=#535c6a
mid.light.color=#454a54
mid.color=#303641
dark.color=#13151a
text.color=#f2f2f2
window.text.color=#f2f2f2
button.text.color=#f2f2f2
disabled.text.color=#a8adb7
tooltip.text.color=#f2f2f2
highlight.color={{ .accent }}
inactive.highlight.color={{ .accent }}
highlight.text.color=#171a1f
link.color={{ .accent }}
link.visited.color=#d3bc86
progress.indicator.text.color=#171a1f

[Hacks]
respect_darkness=false
no_selection_tint=false
transparent_dolphin_view=false
transparent_ktitle_label=false
transparent_pcmanfm_view=false

; Flat SVG surfaces should not be combined with embossed text highlights.
[PanelButtonCommand]
text.shadow=false
text.normal.color=#f2f2f2
text.focus.color=#f2f2f2
text.press.color=#f2f2f2
text.toggle.color=#f2f2f2

[DockTitle]
text.shadow=false

[HeaderSection]
text.shadow=false

[Toolbar]
text.shadow=false

[Tab]
text.shadow=false

; Use our flat SVG pieces instead of embedded fallback frames.
[TabFrame]
frame=true
frame.element=tabframe
interior=true
interior.element=tabframe
frame.top=4
frame.bottom=4
frame.left=4
frame.right=4

[Slider]
frame.element=slider
interior.element=slider

[ScrollbarSlider]
interior=false
