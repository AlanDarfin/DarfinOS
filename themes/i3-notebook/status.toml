# DarfinOS · i3bar com rótulos legíveis sem fontes de ícones
[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#171a1f"
idle_fg = "#f2f2f2"
info_fg = "{{ .accent }}"
warning_fg = "{{ .accent }}"
critical_fg = "#ff7b7b"

[[block]]
block = "custom"
command = "echo Apps"
interval = "once"
[block.theme_overrides]
idle_bg = "#252930"
idle_fg = "{{ .accent }}"
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" apps'

[[block]]
block = "custom"
command = "echo Janelas"
interval = "once"
[block.theme_overrides]
idle_bg = "#252930"
idle_fg = "{{ .accent }}"
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" windows'

[[block]]
block = "custom"
command = "echo Atalhos"
interval = "once"
[block.theme_overrides]
idle_bg = "#252930"
idle_fg = "{{ .accent }}"
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" shortcuts'

[[block]]
block = "custom"
command = "echo Fundo"
interval = "once"
[block.theme_overrides]
idle_bg = "#252930"
idle_fg = "{{ .accent }}"
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" wallpaper'

[[block]]
block = "battery"
driver = "sysfs"
format = " BAT $percentage "
full_format = " BAT $percentage "
missing_format = ""

[[block]]
block = "net"
interval = 5
format = " {Wi-Fi $signal_strength|Rede} "
inactive_format = " Sem rede "
missing_format = " Sem rede "
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" network'

[[block]]
block = "sound"
format = " {VOL $volume|Mudo} "
max_vol = 100
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" audio'

[[block]]
block = "custom"
command = "echo BT"
interval = "once"
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" bluetooth'

[[block]]
block = "time"
interval = 30
format = " $timestamp.datetime(f:'%d/%m %H:%M') "

[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" calendar'

[[block]]
block = "custom"
command = "echo Sessão"
interval = "once"
[[block.click]]
button = "left"
cmd = 'sh "$HOME/.config/darfinos/i3-notebook/session.sh" system'
