; DarfinOS Notebook · compact Powerline-style top bar
[colors]
base = #20242b
ink = #171a1f
text = #f2f2f2
muted = #a8adb7
accent = {{ .accent }}
bronze = #bc9859
sand = #efd799
shade = #4b4333
alert = #ff7b7b

[bar/notebook]
wm-name = darfinos-notebook-bar
width = 100%
height = 28px
top = true
wm-restack = i3
modules-left = apps workspaces ws-edge dock media windows shortcuts files wallpaper title
modules-right = tray audio mic brightness battery network bluetooth clock session
background = ${colors.base}
foreground = ${colors.text}
font-0 = JetBrainsMono Nerd Font Mono:style=Regular:pixelsize=13;3
font-1 = PowerlineSymbols:pixelsize=28;6
font-2 = DejaVu Sans:pixelsize=13;3
line-size = 2px
enable-ipc = true

[settings]
screenchange-reload = true

[module/apps]
type = custom/text
label = " 󰣇 Apps "
format-background = ${colors.accent}
format-foreground = ${colors.ink}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" apps

[module/workspaces]
type = internal/i3
enable-click = true
enable-scroll = false
format = <label-state><label-mode>
format-background = ${colors.shade}
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.accent}
label-focused = %name:0:9%
label-focused-foreground = ${colors.ink}
label-focused-background = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name:0:9%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.muted}
label-visible = %name:0:9%
label-visible-foreground = ${colors.sand}
label-visible-background = ${colors.shade}
label-visible-padding = 1
label-urgent = %name:0:9%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.ink}
label-urgent-padding = 1
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.ink}
label-mode-background = ${colors.sand}
strip-wsnumbers = true

[module/ws-edge]
type = custom/text
label = %{T2}%{T-}
label-foreground = ${colors.shade}

[module/dock]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" window-dock
tail = true

[module/media]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" media watch
tail = true
format-foreground = ${colors.sand}

[module/windows]
type = custom/text
label = 󰖯
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" window-list
click-right = sh "$HOME/.config/darfinos/i3-notebook/session.sh" window-list-minimized

[module/shortcuts]
type = custom/text
label = 󰌌
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" shortcuts
click-right = sh "$HOME/.config/darfinos/i3-notebook/session.sh" settings

[module/files]
type = custom/text
label = 󰉋
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" notebook-files

[module/wallpaper]
type = custom/text
label = 󰸉
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" wallpaper

[module/title]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" window-title
tail = true
label = %output:0:20:…%
label-foreground = ${colors.muted}
label-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 4px
tray-padding = 2px
tray-maxsize = 16px

[module/audio]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" sink
interval = 2
label = %output%
label-padding = 1
format-background = ${colors.shade}
format-foreground = ${colors.sand}
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.shade}
format-prefix-background = ${colors.base}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" audio
click-right = sh "$HOME/.config/darfinos/i3-notebook/session.sh" volume-mute
scroll-up = sh "$HOME/.config/darfinos/i3-notebook/session.sh" volume-up
scroll-down = sh "$HOME/.config/darfinos/i3-notebook/session.sh" volume-down

[module/mic]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" source
interval = 2
label = %output%
label-padding = 1
format-background = ${colors.shade}
format-foreground = ${colors.sand}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" audio
click-right = sh "$HOME/.config/darfinos/i3-notebook/session.sh" mic-mute

; Optional hardware uses the audio/network band, so removing it never breaks an edge.
[module/brightness]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" brightness-status
interval = 2
label = %output%
label-padding = 1
format-background = ${colors.shade}
format-foreground = ${colors.sand}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" brightness
scroll-up = sh "$HOME/.config/darfinos/i3-notebook/session.sh" brightness-up
scroll-down = sh "$HOME/.config/darfinos/i3-notebook/session.sh" brightness-down

[module/battery]
type = internal/battery
battery = ${env:DARFINOS_BAR_BATTERY:BAT0}
low-at = 15
format-charging = <label-charging>
format-charging-background = ${colors.shade}
format-charging-foreground = ${colors.sand}
label-charging = " 󰂄 %percentage%% "
format-discharging = <label-discharging>
format-discharging-background = ${colors.shade}
format-discharging-foreground = ${colors.sand}
label-discharging = " 󰁿 %percentage%% "
format-full = <label-full>
format-full-background = ${colors.shade}
format-full-foreground = ${colors.sand}
label-full = " 󰁹 %percentage%% "
format-low = <label-low>
format-low-background = ${colors.shade}
format-low-foreground = ${colors.alert}
label-low = " 󰂃 %percentage%% "

[module/network]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" network-status
interval = 5
label = %output%
label-padding = 1
format-background = ${colors.shade}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" network
click-right = sh "$HOME/.config/darfinos/i3-notebook/session.sh" network-editor

[module/bluetooth]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" bluetooth-status
interval = 5
label = %output%
label-padding = 1
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.bronze}
format-prefix-background = ${colors.shade}
format-background = ${colors.bronze}
format-foreground = ${colors.ink}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" bluetooth

[module/clock]
type = custom/script
exec = LC_ALL=C date '+%d/%m %H:%M'
interval = 5
label = " 󰃭 %output% "
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.accent}
format-prefix-background = ${colors.bronze}
format-background = ${colors.accent}
format-foreground = ${colors.ink}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" calendar

[module/session]
type = custom/text
label = " 󰐥 "
format-background = ${colors.accent}
format-foreground = ${colors.ink}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" system
