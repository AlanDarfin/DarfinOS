; DarfinOS Notebook · compact Powerline-style top bar
[colors]
base = #36383f
ink = #171a1f
text = #f2f2f2
muted = #cbc6b9
accent = {{ .accent }}
bronze = #bc9859
sand = #efd799
shade = #61533a
alert = #ff7b7b

[bar/notebook]
wm-name = darfinos-notebook-bar
width = 100%
height = 28px
top = true
modules-left = apps workspaces ws-edge windows shortcuts wallpaper title
modules-right = audio brightness battery wired wireless clock
background = ${colors.base}
foreground = ${colors.text}
font-0 = JetBrains Mono:style=Medium:pixelsize=13;3
font-1 = PowerlineSymbols:pixelsize=28;6
font-2 = Font Awesome 7 Free:style=Solid:pixelsize=13;3
font-3 = DejaVu Sans:pixelsize=13;3
cursor-click = pointer
enable-ipc = true

[settings]
screenchange-reload = true

[module/apps]
type = custom/text
label = "  Apps "
format-background = ${colors.accent}
format-foreground = ${colors.ink}
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" apps

[module/workspaces]
type = internal/i3
enable-click = true
enable-scroll = false
format = <label-state><label-mode>
format-background = ${colors.shade}
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.accent}
label-focused = %name:0:9%
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name:0:9%
label-unfocused-padding = 1
label-visible = %name:0:9%
label-visible-foreground = ${colors.sand}
label-visible-padding = 1
label-urgent = %name:0:9%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.ink}
label-urgent-padding = 1
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.accent}
strip-wsnumbers = true

[module/ws-edge]
type = custom/text
label = %{T2}%{T-}
label-foreground = ${colors.shade}

[module/windows]
type = custom/text
label = Janelas
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" windows

[module/shortcuts]
type = custom/text
label = Atalhos
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" shortcuts

[module/wallpaper]
type = custom/text
label = Fundo
label-padding = 1
click-left = sh "$HOME/.config/darfinos/i3-notebook/session.sh" wallpaper

[module/title]
type = custom/script
exec = sh "$HOME/.config/darfinos/i3-notebook/session.sh" window-title
tail = true
label = %output%
label-foreground = ${colors.muted}
label-padding = 1

; The edge is part of each status format so unplugged/absent devices leave no orphan arrows.
[module/audio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-prefix = %{T2}%{T-}
format-volume-prefix-foreground = ${colors.shade}
format-volume-prefix-background = ${colors.base}
format-volume-background = ${colors.shade}
label-volume = "  %percentage%% "
format-muted = <label-muted>
format-muted-prefix = ${self.format-volume-prefix}
format-muted-prefix-foreground = ${self.format-volume-prefix-foreground}
format-muted-prefix-background = ${self.format-volume-prefix-background}
format-muted-background = ${colors.shade}
label-muted = "  Mudo "
click-right = sh "$HOME/.config/darfinos/i3-notebook/session.sh" volume-mute

[module/brightness]
type = internal/backlight
enable-scroll = false
format = <label>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.bronze}
format-prefix-background = ${colors.base}
format-background = ${colors.bronze}
format-foreground = ${colors.ink}
label = "  %percentage%% "

[module/battery]
type = internal/battery
battery = ${env:DARFINOS_BAR_BATTERY:BAT0}
low-at = 15
format-charging = <label-charging>
format-charging-prefix = %{T2}%{T-}
format-charging-prefix-foreground = ${colors.sand}
format-charging-prefix-background = ${colors.base}
format-charging-background = ${colors.sand}
format-charging-foreground = ${colors.ink}
label-charging = "  %percentage%% "
format-discharging = <label-discharging>
format-discharging-prefix = ${self.format-charging-prefix}
format-discharging-prefix-foreground = ${self.format-charging-prefix-foreground}
format-discharging-prefix-background = ${self.format-charging-prefix-background}
format-discharging-background = ${colors.sand}
format-discharging-foreground = ${colors.ink}
label-discharging = "  %percentage%% "
format-full = <label-full>
format-full-prefix = ${self.format-charging-prefix}
format-full-prefix-foreground = ${self.format-charging-prefix-foreground}
format-full-prefix-background = ${self.format-charging-prefix-background}
format-full-background = ${colors.sand}
format-full-foreground = ${colors.ink}
label-full = "  %percentage%% "
format-low = <label-low>
format-low-prefix = %{T2}%{T-}
format-low-prefix-foreground = ${colors.alert}
format-low-prefix-background = ${colors.base}
format-low-background = ${colors.alert}
format-low-foreground = ${colors.ink}
label-low = "  %percentage%% "

[module/wired]
type = internal/network
interface-type = wired
interval = 5
format-connected = <label-connected>
format-connected-prefix = %{T2}%{T-}
format-connected-prefix-foreground = ${colors.shade}
format-connected-prefix-background = ${colors.base}
format-connected-background = ${colors.shade}
label-connected = "  Rede "
format-disconnected =

[module/wireless]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-connected-prefix = ${module/wired.format-connected-prefix}
format-connected-prefix-foreground = ${colors.shade}
format-connected-prefix-background = ${colors.base}
format-connected-background = ${colors.shade}
label-connected = "  %signal%% "
format-disconnected = <label-disconnected>
format-disconnected-prefix = ${self.format-connected-prefix}
format-disconnected-prefix-foreground = ${self.format-connected-prefix-foreground}
format-disconnected-prefix-background = ${self.format-connected-prefix-background}
format-disconnected-background = ${colors.shade}
label-disconnected = "  Off "

[module/clock]
type = internal/date
interval = 5
date = %d/%m
time = %H:%M
label = "  %date% %time% "
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.accent}
format-prefix-background = ${colors.base}
format-background = ${colors.accent}
format-foreground = ${colors.ink}
