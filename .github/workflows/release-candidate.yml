name: DarfinOS · Preparar pacote candidato

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão candidata (ex.: 0.1.0-rc1). Não publica release."
        required: true
        default: "0.1.0-rc1"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Testar scripts e componentes
        run: |
          bash -n DarfinOSInstallScript.sh
          python -m py_compile DarfinOSInstallScript-TUI.py darfinos_control.py
          python -m unittest discover -s tests -v
          python DarfinOSInstallScript-TUI.py --doctor
      - name: Criar pacote e SHA256
        run: bash scripts/package_release.sh "${{ inputs.version }}"
      - name: Publicar apenas artifact de CI
        uses: actions/upload-artifact@v4
        with:
          name: "darfinos-${{ inputs.version }}-candidate"
          path: dist/*
          if-no-files-found: error
          retention-days: 14
