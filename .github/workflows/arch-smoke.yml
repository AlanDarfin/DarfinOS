name: DarfinOS · Smoke real de ambiente Arch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-smoke:
    name: Arch Linux · inspeção e testes seguros
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      - name: Preparar runtime em contêiner descartável
        run: |
          pacman -Syu --noconfirm --needed python git sudo curl
      - name: Obter código do projeto
        uses: actions/checkout@v4
      - name: Executar testes e verificações somente leitura
        run: bash tests/integration_arch_smoke.sh

  i3-notebook:
    name: Arch Linux · i3 Notebook em X11 virtual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
    steps:
      - name: Preparar i3 e servidor virtual no contêiner
        run: |
          pacman -Syu --noconfirm --needed python git dbus i3-wm i3status i3lock xss-lock xterm ttf-dejavu rofi dunst libnotify i3status-rust chezmoi xorg-server-xvfb xorg-xrandr xorg-xrdb xorg-xsetroot xorg-xprop feh adwaita-cursors polybar xdotool xorg-xwininfo ttf-jetbrains-mono-nerd powerline-fonts librsvg xdg-utils gtk3 python-gobject python-xlib playerctl thunar gvfs adwaita-icon-theme fastfetch chafa imagemagick
      - uses: actions/checkout@v4
      - name: Validar perfil e notificações sem alterar o host
        env:
          DARFINOS_PREVIEW_DIR: ${{ github.workspace }}/i3-notebook-preview
        run: bash tests/integration_i3_notebook.sh
      - name: Guardar prévias em 720p
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i3-notebook-preview
          path: i3-notebook-preview/*.png
          if-no-files-found: ignore
